interface:
  display_name: "Opportunity Pulse Outlook"
  short_description: "Capture tagged Outlook evidence"
  default_prompt: "Use $pulse-03-outlook to scan incremental @agent_data Outlook messages."

dependencies:
  tools:
    - type: "mcp"
      value: "microsoft_outlook_email"
      description: "Outlook connector for received and sent messages"
    - type: "mcp"
      value: "oracle-opportunity-pulse"
      description: "Candidate proposal and approval tools"

policy:
  allow_implicit_invocation: true
